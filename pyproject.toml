[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autobot"
version = "3.1.2"
description = "Autobot desktop automation tooling with a terminal CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "APScheduler==3.11.2",
  "blinker==1.9.0",
  "bottle==0.13.4",
  "certifi==2026.1.4",
  "click==8.3.1",
  "Flask==3.1.3",
  "flask-cors==6.0.2",
  "itsdangerous==2.2.0",
  "Jinja2==3.1.6",
  "loguru==0.7.3",
  "MarkupSafe==3.0.3",
  "MouseInfo==0.1.3",
  "packaging==26.0",
  "platformdirs==4.9.2",
  "proxy_tools==0.1.0",
  "PyAutoGUI==0.9.54",
  "PyGetWindow==0.0.9",
  "PyMsgBox==2.0.1",
  "pynput==1.8.1",
  "pyobjc-core==12.1",
  "pyobjc-framework-ApplicationServices==12.1",
  "pyobjc-framework-Cocoa==12.1",
  "pyobjc-framework-CoreText==12.1",
  "pyobjc-framework-Quartz==12.1",
  "pyobjc-framework-Security==12.1",
  "pyobjc-framework-UniformTypeIdentifiers==12.1",
  "pyobjc-framework-WebKit==12.1",
  "pyperclip==1.11.0",
  "PyRect==0.2.0",
  "PyScreeze==1.0.1",
  "pytweening==1.2.0",
  "pywebview==6.1",
  "PyYAML==6.0.3",
  "rubicon-objc==0.5.3",
  "six==1.17.0",
  "typing_extensions==4.15.0",
  "tzlocal==5.3.1",
  "Werkzeug==3.1.6",
  "wheel==0.46.3",
]

[project.scripts]
autobot = "autobot_cli:main"

[tool.setuptools]
py-modules = [
  "autobot_cli",
  "autobot_runtime",
  "config",
  "create_icon",
  "kiosk",
  "main",
  "packager",
  "path_provider",
  "proc_probe",
  "process_bundled_binary",
  "process_killer",
  "process_manager",
  "process_no_console",
]

[tool.setuptools.packages.find]
include = ["backend*", "robotization*", "scheduler*", "ssca_agent*"]
